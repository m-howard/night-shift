name: Support / Question
description: Ask a question or request help using the self-hosted runners
labels: ["kind:support", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Need help or have a question? We're happy to assist. Please provide enough detail so we can help you effectively.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with?
    validations:
      required: true
  - type: textarea
    id: what-you-tried
    attributes:
      label: What You've Tried
      description: Have you already tried anything? Include steps, docs you've read, or errors you've seen.
    validations:
      required: false
  - type: input
    id: runner-label
    attributes:
      label: Runner Label (if applicable)
      description: Which runner label is this about?
      placeholder: "e.g. linux, linux-arm64, copilot-coding-agent"
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context that might help us answer your question.
    validations:
      required: false
