name: Feature Request
description: Suggest a new feature or improvement
labels: ["kind:feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature or an improvement to the self-hosted runners? Describe it below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What pain point are you experiencing?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches? If so, describe them.
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What area does this feature relate to?
      options:
        - Runner configuration
        - Runner labels / scale sets
        - Networking / proxy
        - Security
        - Observability / logging
        - Documentation
        - CI/CD workflow integration
        - Other
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references that might help.
    validations:
      required: false
